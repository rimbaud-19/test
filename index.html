<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f7f7f5;color:#1a1a1a;line-height:1.6}
.container{max-width:820px;margin:0 auto;padding:2rem 1.5rem}
h1{font-size:20px;font-weight:600;margin-bottom:0.25rem}
.subtitle{font-size:13px;color:#888;margin-bottom:1.25rem}
.page-nav{display:flex;gap:0;margin-bottom:1.5rem;border-bottom:2px solid #e0e0e0}
.page-tab{padding:10px 20px;font-size:14px;font-weight:500;color:#888;cursor:pointer;border:none;background:none;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all 0.2s;font-family:inherit}
.page-tab:hover{color:#555}
.page-tab.active{color:#185fa5;border-bottom-color:#185fa5}
.page{display:none}.page.active{display:block}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:1.5rem}
.tab{padding:7px 16px;font-size:13px;border-radius:8px;border:1px solid #e0e0e0;background:#fff;color:#666;cursor:pointer;transition:all 0.2s;font-family:inherit}
.tab:hover{border-color:#aaa}
.tab.active{border-color:#3266ad;background:#e6f1fb;color:#185fa5;font-weight:500}
.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:1.5rem}
.metric{background:#fff;border-radius:10px;padding:1rem 1.25rem;border:1px solid #eee}
.metric-label{font-size:12px;color:#999}
.metric-value{font-size:22px;font-weight:600;margin-top:4px;color:#1a1a1a}
.section-label{font-size:13px;color:#888;margin-bottom:8px}
.chart-wrap{position:relative;width:100%;height:280px;background:#fff;border-radius:10px;border:1px solid #eee;padding:1rem;margin-bottom:1.5rem}
.gender-row{display:flex;align-items:center;gap:12px;margin-bottom:0.5rem}
.gender-bar{flex:1;height:28px;border-radius:8px;overflow:hidden;display:flex}
.gender-legend{display:flex;gap:14px;font-size:12px;color:#888;flex-shrink:0}
.legend-dot{width:10px;height:10px;border-radius:2px;display:inline-block;vertical-align:middle;margin-right:4px}
.insight{font-size:13px;color:#666;background:#fff;border-radius:10px;border:1px solid #eee;padding:1rem 1.25rem;line-height:1.7}
.insight::before{content:"💡 "}

.prod-list{display:flex;flex-direction:column;gap:10px;margin-bottom:1.5rem}
.prod-item{background:#fff;border:1px solid #eee;border-radius:10px;padding:14px 18px;cursor:pointer;transition:all 0.2s}
.prod-item:hover{border-color:#aaa}
.prod-item.active{border-color:#3266ad;box-shadow:0 0 0 1px #3266ad}
.prod-row{display:flex;justify-content:space-between;align-items:center}
.prod-rank{font-size:12px;color:#aaa;font-weight:600;margin-right:10px;min-width:22px}
.prod-name{font-size:14px;font-weight:500;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prod-rev{font-size:13px;color:#185fa5;font-weight:500;margin-left:12px;white-space:nowrap}
.prod-meta{display:flex;gap:16px;margin-top:6px;font-size:12px;color:#999}
.prod-badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:500}
.badge-peak{background:#e6f1fb;color:#185fa5}
.badge-female{background:#fbeaf0;color:#993556}
.badge-male{background:#e6f1fb;color:#185fa5}

.detail-panel{background:#fff;border:1px solid #eee;border-radius:10px;padding:1.25rem;margin-bottom:1.5rem}
.detail-title{font-size:15px;font-weight:600;margin-bottom:4px}
.detail-sub{font-size:12px;color:#999;margin-bottom:1rem}
.detail-metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:1.25rem}
.dm{text-align:center;padding:8px 0}
.dm-label{font-size:11px;color:#999}
.dm-val{font-size:18px;font-weight:600;margin-top:2px}
.detail-chart{position:relative;width:100%;height:220px;margin-bottom:1rem}
.detail-gender{display:flex;align-items:center;gap:12px}
.compare-note{font-size:12px;color:#888;margin-top:6px;line-height:1.6}

@media(max-width:600px){
  .metrics,.detail-metrics{grid-template-columns:1fr 1fr}
  .container{padding:1.25rem 1rem}
  .gender-row,.detail-gender{flex-direction:column;align-items:stretch}
  .prod-rev{font-size:12px}
}
</style>
</head>

const LABELS=["14~16","17~19","20~25","26~30","31~35","36~40","41~45","46~50","51~55","56~60","61~65","66~70","71+"];
const CATS=Object.keys(CAT_DATA);
let chart1,chart2,curCat1=CATS[0],curCat2=CATS[0],curProd=0;

function fmt(n){return n>=100000000?(n/100000000).toFixed(1)+'억원':(n/10000).toLocaleString()+'만원'}

function switchPage(p){
  document.querySelectorAll('.page').forEach(el=>el.classList.remove('active'));
  document.querySelectorAll('.page-tab').forEach(el=>el.classList.remove('active'));
  if(p==='overview'){
    document.getElementById('page-overview').classList.add('active');
    document.querySelectorAll('.page-tab')[0].classList.add('active');
  } else {
    document.getElementById('page-products').classList.add('active');
    document.querySelectorAll('.page-tab')[1].classList.add('active');
  }
}

function renderOverview(cat){
  curCat1=cat;
  const d=CAT_DATA[cat];
  document.getElementById('tabs1').innerHTML=CATS.map(k=>`<button class="tab${k===cat?' active':''}" onclick="renderOverview('${k}')">${k}</button>`).join('');
  document.getElementById('metrics1').innerHTML=`<div class="metric"><div class="metric-label">총 결제금액</div><div class="metric-value">${fmt(d.revenue)}</div></div><div class="metric"><div class="metric-label">총 결제건수</div><div class="metric-value">${d.orders.toLocaleString()}건</div></div><div class="metric"><div class="metric-label">핵심 연령대</div><div class="metric-value">${d.peak}</div></div>`;
  const vals=LABELS.map(l=>d.age[l]||0),mx=Math.max(...vals),cols=vals.map(v=>v===mx?'#3266ad':'#B5D4F4');
  if(chart1)chart1.destroy();
  chart1=new Chart(document.getElementById('ageChart1'),{type:'bar',data:{labels:LABELS,datasets:[{data:vals,backgroundColor:cols,borderRadius:3,maxBarThickness:40}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>c.parsed.y.toFixed(1)+'%'}}},scales:{y:{beginAtZero:true,ticks:{callback:v=>v+'%',font:{size:11}},grid:{color:'rgba(0,0,0,0.06)'}},x:{ticks:{font:{size:11},maxRotation:45,autoSkip:false},grid:{display:false}}}}});
  const f=d.gender['여성']||0,m=d.gender['남성']||0;
  document.getElementById('gender1').innerHTML=`<div class="gender-bar"><div style="width:${f}%;background:#ED93B1;transition:width .3s"></div><div style="width:${m}%;background:#85B7EB;transition:width .3s"></div></div><div class="gender-legend"><span><span class="legend-dot" style="background:#ED93B1"></span>여성 ${f.toFixed(1)}%</span><span><span class="legend-dot" style="background:#85B7EB"></span>남성 ${m.toFixed(1)}%</span></div>`;
  document.getElementById('insight1').textContent=d.note;
}

function renderProducts(cat,selIdx){
  curCat2=cat;curProd=selIdx||0;
  const prods=PROD_DATA[cat];
  document.getElementById('tabs2').innerHTML=CATS.map(k=>`<button class="tab${k===cat?' active':''}" onclick="renderProducts('${k}')">${k}</button>`).join('');
  document.getElementById('prodList').innerHTML=prods.map((p,i)=>`<div class="prod-item${i===curProd?' active':''}" onclick="selectProd(${i})"><div class="prod-row"><span class="prod-rank">${i+1}</span><span class="prod-name">${p.name}</span><span class="prod-rev">${fmt(p.revenue)}</span></div><div class="prod-meta"><span class="prod-badge badge-peak">핵심 ${p.peak}세</span><span class="prod-badge badge-female">여 ${p.female}%</span><span>결제 ${p.orders.toLocaleString()}건</span></div></div>`).join('');
  renderDetail(cat,curProd);
}

function selectProd(i){
  curProd=i;
  document.querySelectorAll('.prod-item').forEach((el,j)=>{el.classList.toggle('active',j===i)});
  renderDetail(curCat2,i);
}

function renderDetail(cat,idx){
  const p=PROD_DATA[cat][idx],cd=CAT_DATA[cat];
  document.getElementById('detailPanel').style.display='block';
  document.getElementById('detailTitle').textContent=p.name;
  document.getElementById('detailSub').textContent=cat+' 카테고리 · '+p.orders.toLocaleString()+'건 결제';
  
  const avgPrice=Math.round(p.revenue/p.orders);
  document.getElementById('detailMetrics').innerHTML=`<div class="dm"><div class="dm-label">결제금액</div><div class="dm-val">${fmt(p.revenue)}</div></div><div class="dm"><div class="dm-label">결제건수</div><div class="dm-val">${p.orders.toLocaleString()}</div></div><div class="dm"><div class="dm-label">건당 단가</div><div class="dm-val">${Math.round(avgPrice/100)*100>10000?(Math.round(avgPrice/1000)*1000/10000).toFixed(1)+'만':avgPrice.toLocaleString()+'원'}</div></div><div class="dm"><div class="dm-label">핵심연령</div><div class="dm-val" style="color:#185fa5">${p.peak}세</div></div>`;
  
  const vals=LABELS.map(l=>p.age[l]||0),catVals=LABELS.map(l=>cd.age[l]||0),mx=Math.max(...vals);
  if(chart2)chart2.destroy();
  chart2=new Chart(document.getElementById('ageChart2'),{type:'bar',data:{labels:LABELS,datasets:[{label:'이 상품',data:vals,backgroundColor:vals.map(v=>v===mx?'#3266ad':'#B5D4F4'),borderRadius:3,maxBarThickness:32,order:1},{label:cat+' 평균',data:catVals,type:'line',borderColor:'#ED93B1',backgroundColor:'transparent',pointBackgroundColor:'#ED93B1',pointRadius:3,borderWidth:2,tension:.3,order:0}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>c.dataset.label+': '+c.parsed.y.toFixed(1)+'%'}}},scales:{y:{beginAtZero:true,ticks:{callback:v=>v+'%',font:{size:11}},grid:{color:'rgba(0,0,0,0.06)'}},x:{ticks:{font:{size:10},maxRotation:45,autoSkip:false},grid:{display:false}}}}});
  
  document.getElementById('gender2').innerHTML=`<div class="gender-bar"><div style="width:${p.female}%;background:#ED93B1;transition:width .3s"></div><div style="width:${p.male}%;background:#85B7EB;transition:width .3s"></div></div><div class="gender-legend"><span><span class="legend-dot" style="background:#ED93B1"></span>여성 ${p.female}%</span><span><span class="legend-dot" style="background:#85B7EB"></span>남성 ${p.male}%</span></div>`;
  
  const catF=cd.gender['여성']||0, catM=cd.gender['남성']||0;
  const fDiff=(p.female-catF).toFixed(1), mDiff=(p.male-catM).toFixed(1);
  const peakDiff=p.peak!==cd.peak.replace('세','')?`핵심 연령이 카테고리 평균(${cd.peak})과 다르게 ${p.peak}세에 집중.`:`카테고리 평균과 동일하게 ${p.peak}세 중심.`;
  const genderNote=Math.abs(parseFloat(fDiff))>=3?`여성 비율이 카테고리 평균 대비 ${fDiff>0?'+':''}${fDiff}%p 차이.`:'성별 비율은 카테고리 평균과 유사.';
  
  document.getElementById('compareNote').innerHTML=`<span style="display:inline-flex;align-items:center;gap:4px"><span class="legend-dot" style="background:#3266ad"></span>이 상품</span>&nbsp;&nbsp;<span style="display:inline-flex;align-items:center;gap:4px"><span style="width:16px;height:2px;background:#ED93B1;display:inline-block;border-radius:1px"></span>${cat} 평균</span><br>${peakDiff} ${genderNote}`;
}

renderOverview(curCat1);
renderProducts(curCat2);
</script>
